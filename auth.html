<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>秘跡 - 登入註冊</title>
    <link rel="icon" type="image/png" href="favicon.png"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #000 0%, #1a1a1a 50%, #000 100%);
            color: #f5f5f7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .auth-container {
            max-width: 400px;
            width: 90%;
            padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo h1 {
            font-size: 2.5rem;
            font-weight: 600;
            background: linear-gradient(135deg, #4ECDC4, #44A08D);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }
        
        .logo p {
            color: #a1a1aa;
            font-size: 16px;
        }
        
        .auth-tabs {
            display: flex;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 4px;
        }
        
        .tab-button {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            color: #a1a1aa;
            font-size: 16px;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .tab-button.active {
            background: rgba(78, 205, 196, 0.2);
            color: #4ECDC4;
        }
        
        .auth-form {
            display: none;
        }
        
        .auth-form.active {
            display: block;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #f5f5f7;
            font-size: 14px;
            font-weight: 500;
        }
        
        .form-group input {
            width: 100%;
            padding: 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: #f5f5f7;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #4ECDC4;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 0 3px rgba(78, 205, 196, 0.1);
        }
        
        .form-group input::placeholder {
            color: #888;
        }
        
        .submit-button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #4ECDC4, #44A08D);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }
        
        .submit-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(78, 205, 196, 0.3);
        }
        
        .submit-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
            color: #888;
        }
        
        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }
        
        .divider span {
            background: rgba(0, 0, 0, 0.8);
            padding: 0 15px;
        }
        
        .google-button {
            width: 100%;
            padding: 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: #f5f5f7;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .google-button:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-1px);
        }
        
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        
        .back-link a {
            color: #4ECDC4;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }
        
        .back-link a:hover {
            color: #44A08D;
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 20px;
            border-radius: 12px;
            color: white;
            font-weight: 500;
            z-index: 1000;
            transform: translateX(400px);
            transition: transform 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        .notification.show {
            transform: translateX(0);
        }
        
        .notification.success {
            background: rgba(76, 175, 80, 0.9);
        }
        
        .notification.error {
            background: rgba(244, 67, 54, 0.9);
        }
        
        .loading {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #4ECDC4;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 480px) {
            .auth-container {
                padding: 30px 20px;
            }
            
            .logo h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="logo">
            <h1>🔮 秘跡</h1>
            <p>隱私優先的位置社交</p>
        </div>
        
        <div class="auth-tabs">
            <button class="tab-button active" onclick="switchTab('login')">登入</button>
            <button class="tab-button" onclick="switchTab('register')">註冊</button>
        </div>
        
        <!-- 登入表單 -->
        <form id="login-form" class="auth-form active">
            <div class="form-group">
                <label for="login-email">電子郵件或用戶名</label>
                <input type="text" id="login-email" name="login" placeholder="輸入電子郵件或用戶名" required>
            </div>
            
            <div class="form-group">
                <label for="login-password">密碼</label>
                <input type="password" id="login-password" name="password" placeholder="輸入密碼" required>
            </div>
            
            <button type="submit" class="submit-button">登入</button>
        </form>
        
        <!-- 註冊表單 -->
        <form id="register-form" class="auth-form">
            <div class="form-group">
                <label for="register-username">用戶名</label>
                <input type="text" id="register-username" name="username" placeholder="輸入用戶名" required>
            </div>
            
            <div class="form-group">
                <label for="register-email">電子郵件</label>
                <input type="email" id="register-email" name="email" placeholder="輸入電子郵件" required>
            </div>
            
            <div class="form-group">
                <label for="register-displayName">顯示名稱</label>
                <input type="text" id="register-displayName" name="displayName" placeholder="輸入顯示名稱" required>
            </div>
            
            <div class="form-group">
                <label for="register-password">密碼</label>
                <input type="password" id="register-password" name="password" placeholder="輸入密碼（至少6位）" required minlength="6">
            </div>
            
            <button type="submit" class="submit-button">註冊</button>
        </form>
        
        <div class="divider">
            <span>或</span>
        </div>
        
        <button class="google-button" onclick="loginWithGoogle()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            使用 Google 登入
        </button>
        
        <div class="back-link">
            <a href="index.html">← 返回首頁</a>
        </div>
    </div>
    
    <!-- 載入畫面 -->
    <div id="loading" class="loading">
        <div class="spinner"></div>
    </div>
    
    <!-- 通知 -->
    <div id="notification" class="notification"></div>
    
    <script>
        // API 配置
        const API_BASE_URL = 'http://localhost:5000';
        
        // 切換標籤
        function switchTab(tab) {
            // 更新標籤按鈕
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // 更新表單
            document.querySelectorAll('.auth-form').forEach(form => {
                form.classList.remove('active');
            });
            document.getElementById(tab + '-form').classList.add('active');
        }
        
        // 顯示通知
        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification ${type} show`;
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }
        
        // 顯示載入
        function showLoading() {
            document.getElementById('loading').style.display = 'flex';
        }
        
        // 隱藏載入
        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }
        
        // API 請求函數
        async function apiRequest(endpoint, options = {}) {
            const url = `${API_BASE_URL}${endpoint}`;
            const config = {
                headers: {
                    'Content-Type': 'application/json'
                },
                ...options
            };
            
            if (config.body && typeof config.body === 'object') {
                config.body = JSON.stringify(config.body);
            }
            
            try {
                const response = await fetch(url, config);
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.message || `HTTP error! status: ${response.status}`);
                }
                
                return data;
            } catch (error) {
                console.error('API request failed:', error);
                throw error;
            }
        }
        
        // 登入處理
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const loginData = {
                login: formData.get('login'),
                password: formData.get('password')
            };
            
            try {
                showLoading();
                
                const response = await apiRequest('/api/auth/login', {
                    method: 'POST',
                    body: loginData
                });
                
                if (response.success) {
                    // 保存 token
                    localStorage.setItem('authToken', response.data.token);
                    localStorage.setItem('refreshToken', response.data.refreshToken);
                    localStorage.setItem('currentUser', JSON.stringify(response.data.user));
                    
                    showNotification('登入成功！正在跳轉...');
                    
                    // 跳轉到應用
                    setTimeout(() => {
                        window.location.href = 'app.html';
                    }, 1500);
                }
            } catch (error) {
                showNotification(error.message, 'error');
            } finally {
                hideLoading();
            }
        });
        
        // 註冊處理
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const registerData = {
                username: formData.get('username'),
                email: formData.get('email'),
                displayName: formData.get('displayName'),
                password: formData.get('password')
            };
            
            try {
                showLoading();
                
                const response = await apiRequest('/api/auth/register', {
                    method: 'POST',
                    body: registerData
                });
                
                if (response.success) {
                    // 保存 token
                    localStorage.setItem('authToken', response.data.token);
                    localStorage.setItem('refreshToken', response.data.refreshToken);
                    localStorage.setItem('currentUser', JSON.stringify(response.data.user));
                    
                    showNotification('註冊成功！正在跳轉...');
                    
                    // 跳轉到應用
                    setTimeout(() => {
                        window.location.href = 'app.html';
                    }, 1500);
                }
            } catch (error) {
                showNotification(error.message, 'error');
            } finally {
                hideLoading();
            }
        });
        
        // Google 登入（模擬）
        function loginWithGoogle() {
            showNotification('Google 登入功能開發中...', 'error');
        }
        
        // 檢查是否已登入
        if (localStorage.getItem('authToken')) {
            // 如果已登入，直接跳轉到應用
            window.location.href = 'app.html';
        }
    </script>
</body>
</html>
