<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人資料 - 秘跡</title>
    <link rel="icon" type="image/png" href="favicon.png"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #000 0%, #1a1a1a 50%, #000 100%);
            color: #f5f5f7;
            min-height: 100vh;
        }
        
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
        }
        
        .back-btn {
            background: none;
            border: none;
            color: #4ECDC4;
            font-size: 18px;
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            transition: background-color 0.3s ease;
        }
        
        .back-btn:hover {
            background: rgba(78, 205, 196, 0.1);
        }
        
        .navbar h1 {
            font-size: 18px;
            font-weight: 600;
        }
        
        .save-btn {
            background: linear-gradient(135deg, #4ECDC4, #44A08D);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        
        .save-btn:hover {
            transform: translateY(-1px);
        }
        
        .container {
            max-width: 600px;
            margin: 80px auto 20px;
            padding: 0 20px;
        }
        
        .profile-header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .avatar-container {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
        }
        
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4ECDC4, #44A08D);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            color: white;
            margin: 0 auto;
        }
        
        .avatar-edit {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 30px;
            height: 30px;
            background: #4ECDC4;
            border: 2px solid #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
        }
        
        .user-stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #4ECDC4;
        }
        
        .stat-label {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }
        
        .form-section {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            margin-bottom: 20px;
        }
        
        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #f5f5f7;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #f5f5f7;
            font-size: 14px;
            font-weight: 500;
        }
        
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: #f5f5f7;
            font-size: 16px;
            transition: all 0.3s ease;
            resize: vertical;
        }
        
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #4ECDC4;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 0 3px rgba(78, 205, 196, 0.1);
        }
        
        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #888;
        }
        
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }
        
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.2);
            transition: .4s;
            border-radius: 24px;
        }
        
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        
        input:checked + .slider {
            background-color: #4ECDC4;
        }
        
        input:checked + .slider:before {
            transform: translateX(26px);
        }
        
        .privacy-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .privacy-item:last-child {
            border-bottom: none;
        }
        
        .privacy-info {
            flex: 1;
        }
        
        .privacy-title {
            font-weight: 500;
            margin-bottom: 4px;
        }
        
        .privacy-desc {
            font-size: 12px;
            color: #888;
        }
        
        .notification {
            position: fixed;
            top: 80px;
            right: 20px;
            padding: 16px 20px;
            border-radius: 12px;
            color: white;
            font-weight: 500;
            z-index: 1000;
            transform: translateX(400px);
            transition: transform 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        .notification.show {
            transform: translateX(0);
        }
        
        .notification.success {
            background: rgba(76, 175, 80, 0.9);
        }
        
        .notification.error {
            background: rgba(244, 67, 54, 0.9);
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 0 15px;
            }
            
            .user-stats {
                gap: 20px;
            }
            
            .form-section {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <button class="back-btn" onclick="goBack()">← 返回</button>
        <h1>個人資料</h1>
        <button class="save-btn" onclick="saveProfile()">保存</button>
    </div>
    
    <div class="container">
        <!-- 個人資料頭部 -->
        <div class="profile-header">
            <div class="avatar-container">
                <div class="avatar" id="user-avatar">U</div>
                <div class="avatar-edit" onclick="changeAvatar()">📷</div>
            </div>
            
            <h2 id="user-display-name">用戶名稱</h2>
            <p id="user-username" style="color: #888; margin-top: 5px;">@username</p>
            
            <div class="user-stats">
                <div class="stat-item">
                    <div class="stat-value" id="user-level">1</div>
                    <div class="stat-label">等級</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="user-messages">0</div>
                    <div class="stat-label">訊息</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="user-experience">0</div>
                    <div class="stat-label">經驗</div>
                </div>
            </div>
        </div>
        
        <!-- 基本資料 -->
        <div class="form-section">
            <h3 class="section-title">基本資料</h3>
            
            <div class="form-group">
                <label for="displayName">顯示名稱</label>
                <input type="text" id="displayName" placeholder="輸入顯示名稱">
            </div>
            
            <div class="form-group">
                <label for="bio">個人簡介</label>
                <textarea id="bio" rows="3" placeholder="介紹一下自己..." maxlength="200"></textarea>
            </div>
        </div>
        
        <!-- 隱私設定 -->
        <div class="form-section">
            <h3 class="section-title">隱私設定</h3>
            
            <div class="privacy-item">
                <div class="privacy-info">
                    <div class="privacy-title">顯示位置</div>
                    <div class="privacy-desc">允許其他用戶看到你的大概位置</div>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" id="showLocation" checked>
                    <span class="slider"></span>
                </label>
            </div>
            
            <div class="privacy-item">
                <div class="privacy-info">
                    <div class="privacy-title">接收私訊</div>
                    <div class="privacy-desc">允許其他用戶向你發送私人訊息</div>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" id="allowDirectMessages" checked>
                    <span class="slider"></span>
                </label>
            </div>
            
            <div class="privacy-item">
                <div class="privacy-info">
                    <div class="privacy-title">顯示在線狀態</div>
                    <div class="privacy-desc">讓其他用戶知道你是否在線</div>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" id="showOnlineStatus" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>
    
    <!-- 通知 -->
    <div id="notification" class="notification"></div>
    
    <script>
        // API 配置
        const API_BASE_URL = 'http://localhost:5000';
        let authToken = localStorage.getItem('authToken');
        let currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
        
        // 檢查認證
        if (!authToken || !currentUser) {
            window.location.href = 'auth.html';
        }
        
        // 顯示通知
        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification ${type} show`;
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }
        
        // API 請求
        async function apiRequest(endpoint, options = {}) {
            const url = `${API_BASE_URL}${endpoint}`;
            const config = {
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${authToken}`
                },
                ...options
            };
            
            if (config.body && typeof config.body === 'object') {
                config.body = JSON.stringify(config.body);
            }
            
            try {
                const response = await fetch(url, config);
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.message || `HTTP error! status: ${response.status}`);
                }
                
                return data;
            } catch (error) {
                console.error('API request failed:', error);
                throw error;
            }
        }
        
        // 載入用戶資料
        async function loadProfile() {
            try {
                const response = await apiRequest('/api/users/profile');
                
                if (response.success) {
                    const user = response.data.user;
                    
                    // 更新顯示
                    document.getElementById('user-display-name').textContent = user.displayName;
                    document.getElementById('user-username').textContent = `@${user.username}`;
                    document.getElementById('user-level').textContent = user.stats?.level || 1;
                    document.getElementById('user-messages').textContent = user.stats?.messagesPosted || 0;
                    document.getElementById('user-experience').textContent = user.stats?.experience || 0;
                    
                    // 設置頭像
                    const avatar = document.getElementById('user-avatar');
                    if (user.avatar) {
                        avatar.style.backgroundImage = `url(${user.avatar})`;
                        avatar.style.backgroundSize = 'cover';
                        avatar.textContent = '';
                    } else {
                        avatar.textContent = user.displayName.charAt(0).toUpperCase();
                    }
                    
                    // 填充表單
                    document.getElementById('displayName').value = user.displayName || '';
                    document.getElementById('bio').value = user.bio || '';
                    
                    // 隱私設定
                    if (user.privacySettings) {
                        document.getElementById('showLocation').checked = user.privacySettings.showLocation !== false;
                        document.getElementById('allowDirectMessages').checked = user.privacySettings.allowDirectMessages !== false;
                        document.getElementById('showOnlineStatus').checked = user.privacySettings.showOnlineStatus !== false;
                    }
                }
            } catch (error) {
                showNotification('載入資料失敗: ' + error.message, 'error');
            }
        }
        
        // 保存資料
        async function saveProfile() {
            try {
                const profileData = {
                    displayName: document.getElementById('displayName').value,
                    bio: document.getElementById('bio').value
                };
                
                const privacyData = {
                    showLocation: document.getElementById('showLocation').checked,
                    allowDirectMessages: document.getElementById('allowDirectMessages').checked,
                    showOnlineStatus: document.getElementById('showOnlineStatus').checked
                };
                
                // 更新基本資料
                await apiRequest('/api/users/profile', {
                    method: 'PUT',
                    body: profileData
                });
                
                // 更新隱私設定
                await apiRequest('/api/users/privacy-settings', {
                    method: 'PUT',
                    body: privacyData
                });
                
                // 更新本地存儲
                currentUser.displayName = profileData.displayName;
                currentUser.bio = profileData.bio;
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                
                showNotification('資料保存成功！');
                
            } catch (error) {
                showNotification('保存失敗: ' + error.message, 'error');
            }
        }
        
        // 更換頭像
        function changeAvatar() {
            showNotification('頭像上傳功能開發中...', 'error');
        }
        
        // 返回
        function goBack() {
            window.history.back();
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadProfile();
        });
    </script>
</body>
</html>
